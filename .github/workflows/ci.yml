name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes unitários e de integração
        run: pytest
      - name: Avaliação determinística (falha se cair abaixo de 90%)
        run: python -m evals.run_eval --mode deterministic --min-pass 0.90 --out evals/results
      - name: Static Space está sincronizado com os documentos
        run: |
          python scripts/build_static.py
          git diff --exit-code static_space/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: evals/results/deterministic-latest.*
