[project]
name = "lily-tasks"
version = "1.0.0"
description = "Lily Tasks — assistente de produtividade com IA (tool calling, RAG, FastAPI, Gradio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "google-genai>=1.0",
  "tzdata",            # necessário no Windows para zoneinfo
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gradio>=5.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "E731", "UP017", "B008"]
